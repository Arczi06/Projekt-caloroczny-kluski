<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Dashboard</title>
    <link rel="stylesheet" href="librarian.css">
</head>
<body>
    <div class="librarian-container">
        <h1>Librarian Dashboard</h1>
    <div class="librarian-functions">
        <h2>Zarządzanie Książkami</h2>
        <button id="add-book">Dodaj Książkę</button>
        <button id="edit-book">Edytuj Książkę</button>
        <button id="delete-book">Usuń Książkę</button>
        <h2>Zarządzanie Użytkownikami</h2>
        <button id="view-users">Zobacz Użytkowników</button>
        <button id="edit-user">Edytuj Użytkownika</button>

            <button id="manage-books">Zarządzaj książkami</button>
            <button id="view-activity">Zobacz aktywność użytkowników</button>
            <button id="handle-reservations">Zarządzaj rezerwacjami</button>
        </div>
        <button id="return-button" onclick="window.location.href='index.html'">Powrót do strony głównej</button>
    </div>
    <script src="librarian.js"></script>
</body>
</html>
