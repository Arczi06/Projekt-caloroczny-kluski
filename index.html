<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register - Book Style</title>
    <link rel="stylesheet" href="loginRegister.css">
    <script>
        function redirectIfNotLoggedIn() {
  // Przykład: sprawdzamy, czy istnieje token autoryzacyjny w localStorage
  const token = localStorage.getItem('authToken');
  
  if (!token) {
    // Jeśli tokenu nie ma, przekierowujemy na stronę logowania
    window.location.href = 'landing.html'; // lub inny adres
  }
}

// Wywołaj funkcję np. na początku ładowania strony
redirectIfNotLoggedIn();
    </script>
</head>
<body>


<div class="candle-light top-left"></div>
<div class="candle-light bottom-left"></div>
<div class="candle-light center"></div>
<div class="candle-light bottom-right"></div>

<div class="book-container">
    <div class="book-page left-page">
        <h2>Login</h2>
        <form action="login.php" method="POST">
            <div class="input-group">
                <input type="text" id="username" name="username" required>
                <label for="username">Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" required>
                <label for="password">Password</label>
            </div>
            <button type="submit">Log In</button>
            <a href="#" id="go-to-register">Don't have an account? Register</a>
        </form>
    </div>
    
    <div class="book-page right-page">
        <h2>Register</h2>
        <form action="register.php" method="POST">
            <div class="input-group">
                <input type="text" id="username" name="username" required>
                <label for="username">Username</label>
            </div>

            <div class="input-group">
                <input type="text" id="email" name="email" required>
                <label for="email">Email</label>
            </div>

            <div class="input-group">
                <input type="password" id="password-reg" name="password" required>
                <label for="password">Password</label>
            </div>
            
            <div class="role-selection">
                <button id="roleToggle">
                    <img src="book-icon.png" alt="Wybierz rolę">
                </button>
                <div id="roleDropdown" class="hidden">
                    <button class="role-btn" data-role="0">📖 Czytelnik</button>
                    <button class="role-btn" data-role="1">📚 Bibliotekarz</button>
                    <button class="role-btn" data-role="2">🏛️ Admin</button>
                </div>
                <span id="selectedRole">Wybierz rolę</span>
                <input type="hidden" name="role" id="roleInput">
            </div>
            

            <button type="submit">Register</button>
            <a href="#" id="go-to-login">Already have an account? Login</a>
        </form>
    </div>

    <div class="page-flip">
        <div class="wyg-strona1" id="stary">
            <p id="stary" style="transform: rotateY(180deg);">Witaj ponownie!</p>
            <img src="logo.png" alt="Brak logo" id="logo">
        </div>
        <div class="wyg-strona2" id="nowy" style="display: none;">
            <p id="nowy">Dołącz teraz!</p>
        </div>
        <div id="password-requirements" style="display: none;">
            <p id="length">Minimalna długość hasła: 8 znaków</p>
            <p id="uppercase">Co najmniej jedna wielka litera</p>
            <p id="number">Co najmniej jedna cyfra</p>
            <p id="special">Co najmniej jeden znak specjalny (!@#$%^&*)</p>
            <p>Zasady użytkowania biblioteki ⤵</p>
            <br>
            <img src="logo2.png" alt="" id="logo2" href="warunki.html">
        </div>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
